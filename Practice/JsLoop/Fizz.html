<!-- เขียนโค้ดใช้ for loop พิมพ์ (console.log) เลข 1 ถึง 20 แต่ถ้าเลขนั้นหารด้วย 3 ลงตัว ให้พิมพ์คำว่า "Fizz" แทนตัวเลข -->
<!DOCTYPE html>
<head>
<title>Max Array</title>
</head>
<body>

<script>
    for (i = 1; i < 21; i++) {
        if (i % 3 == 0){
            console.log("Fizz")
        }
        else {
            console.log(i)
        }
    }
</script>
</body>
</html>
