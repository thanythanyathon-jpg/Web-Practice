<!-- มี 3 กล่อง (<div class="box">) ให้เขียน CSS ด้วย flexbox ให้:
จอเล็ก (< 768px): เรียงกล่องซ้อนกันแนวตั้ง
จอใหญ่ (≥ 768px): เรียงกล่องแนวนอน เว้นระยะห่างเท่ากัน (justify-content) -->
<!doctype html>
<html lang="EN">
  <head>
    <title>Flexbox</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>

  </body>
</html>
