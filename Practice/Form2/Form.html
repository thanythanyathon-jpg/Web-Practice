<!-- เขียนฟอร์มสมัครสมาชิกที่มีช่องกรอก "อีเมล" (ต้องเป็นรูปแบบอีเมลที่ถูกต้อง, บังคับกรอก) และ "รหัสผ่าน" (ต้องมีความยาวอย่างน้อย 8 ตัวอักษร) พร้อมปุ่ม Submit และปุ่ม Reset -->
<!doctype html>
<html lang="EN">
  <head>
    <title>Member Registeration</title>
  </head>
  <body>
    <form>
      <label>Your E-mail</label>
      <input type="email" required><br>
      <label>Your Password</label>
      <input type="password" minlength="8" required><br>
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
