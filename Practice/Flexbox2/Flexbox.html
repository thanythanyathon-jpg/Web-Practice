<!-- มีการ์ด 4 ใบ (<div class="card">) ให้เขียน CSS ด้วย flexbox ให้:

จอเล็ก (< 600px): เรียงการ์ดซ้อนกันแนวตั้ง เต็มความกว้าง
จอใหญ่ (≥ 600px): เรียงการ์ดแนวนอน 4 ใบในแถวเดียวกัน มีช่องว่างระหว่างการ์ดเท่า ๆ กัน -->
<!doctype html>
<html lang="EN">
  <head>
    <title>Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
    </div>
  </body>
</html>
